services:
  - type: web
    name: digidokters
    env: python
    buildCommand: pip install -r requirements.txt && flask db upgrade && flask seed
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: digidokters-db
          property: connectionString
      - key: FLASK_ENV
        value: production

databases:
  - name: digidokters-db
    databaseName: digidokters
    user: digidokters
    plan: free
