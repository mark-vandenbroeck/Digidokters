services:
  - type: web
    name: digidokters
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && flask db upgrade && flask seed
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FLASK_ENV
        value: production