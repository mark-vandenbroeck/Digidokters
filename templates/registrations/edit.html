{% extends 'base.html' %}
{% block title %}Registratie {{ reg.registratienummer }} wijzigen – Digidokters{% endblock %}

{% block content %}
<div class="row justify-content-center">
<div class="col-12 col-lg-8 col-xl-7">

    <div class="d-flex align-items-center gap-2 mb-1">
        <a href="{{ url_for('reg.bekijken', reg_id=reg.id) }}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h1 class="dd-page-title mb-0">
            <i class="bi bi-pencil me-2 text-primary"></i>Registratie wijzigen
        </h1>
    </div>
    <p class="dd-page-subtitle mb-3">
        Registratienummer: <strong>{{ reg.registratienummer }}</strong>
    </p>

    <div class="card">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('reg.wijzigen', reg_id=reg.id) }}" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="row g-3">
                    <div class="col-12 col-sm-6">
                        <label for="datum" class="form-label">Datum <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="datum" name="datum"
                               value="{{ reg.datum.strftime('%Y-%m-%d') }}" required>
                    </div>

                    <div class="col-12 col-sm-6">
                        <label for="digidokter_id" class="form-label">Digidokter <span class="text-danger">*</span></label>
                        <select class="form-select" id="digidokter_id" name="digidokter_id" required>
                            <option value="">— Kies een digidokter —</option>
                            {% for d in digidokters %}
                            <option value="{{ d.id }}" {{ 'selected' if d.id == reg.digidokter_id }}>{{ d.naam }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-12">
                        <label for="client" class="form-label">Cliënt <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="client" name="client"
                               value="{{ reg.client }}" maxlength="150" required>
                    </div>

                    <div class="col-12 col-sm-6">
                        <label class="form-label">Nieuwe klant</label>
                        <div class="d-flex gap-3 mt-1">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="nieuwe_klant"
                                       id="nieuw_ja" value="ja" {{ 'checked' if reg.nieuwe_klant }}>
                                <label class="form-check-label" for="nieuw_ja">Ja</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="nieuwe_klant"
                                       id="nieuw_nee" value="nee" {{ 'checked' if not reg.nieuwe_klant }}>
                                <label class="form-check-label" for="nieuw_nee">Nee</label>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6">
                        <label for="herkomst" class="form-label">Herkomst</label>
                        <input type="text" class="form-control" id="herkomst" name="herkomst"
                               value="{{ reg.herkomst or '' }}" maxlength="200">
                    </div>

                    <div class="col-12">
                        <label for="onderwerp" class="form-label">Onderwerp <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="onderwerp" name="onderwerp"
                               value="{{ reg.onderwerp }}" maxlength="500" required>
                    </div>

                    <div class="col-12 col-sm-6">
                        <label for="leeftijdscategorie_id" class="form-label">Leeftijdscategorie <span class="text-danger">*</span></label>
                        <select class="form-select" id="leeftijdscategorie_id" name="leeftijdscategorie_id" required>
                            <option value="">— Kies —</option>
                            {% for l in leeftijdscategorieën %}
                            <option value="{{ l.id }}" {{ 'selected' if l.id == reg.leeftijdscategorie_id }}>{{ l.naam }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-12 col-sm-6">
                        <label for="toestel_id" class="form-label">Toestel <span class="text-danger">*</span></label>
                        <select class="form-select" id="toestel_id" name="toestel_id" required>
                            <option value="">— Kies —</option>
                            {% for t in toestellen %}
                            <option value="{{ t.id }}" {{ 'selected' if t.id == reg.toestel_id }}>{{ t.naam }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <hr class="my-4">
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Opslaan
                    </button>
                    <a href="{{ url_for('reg.bekijken', reg_id=reg.id) }}" class="btn btn-outline-secondary">Annuleren</a>
                </div>
            </form>
        </div>
    </div>
</div>
</div>
{% endblock %}
